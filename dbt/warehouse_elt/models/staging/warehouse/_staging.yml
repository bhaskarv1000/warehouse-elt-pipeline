version: 2

models:
  - name: stg_warehouse__case_fulfillment_events
    description: One row per case per state transition, typed from the RAW JSON.
    columns:
      - name: event_id
        description: Unique id of the state-transition event.
        tests:
          - unique
          - not_null
      - name: case_id
        tests:
          - not_null
      - name: event_type
        tests:
          - accepted_values:
              values: ['CASE_INDUCTED', 'STORED_IN_BUFFER', 'RETRIEVED_FROM_BUFFER', 'PALLET_BUILT', 'SHIPPED']
      - name: event_timestamp
        tests:
          - not_null
      - name: order_id
        description: Assigned at retrieval, so null for CASE_INDUCTED and STORED_IN_BUFFER.
        tests:
          - not_null:
              config:
                where: "event_type not in ('CASE_INDUCTED', 'STORED_IN_BUFFER')"

  - name: stg_warehouse__equipment_telemetry
    description: One row per asset per 20-second heartbeat.
    columns:
      - name: telemetry_id
        tests:
          - unique
          - not_null
      - name: asset_id
        tests:
          - not_null
      - name: operational_state
        tests:
          - accepted_values:
              values: ['RUNNING', 'IDLE', 'CHARGING', 'FAULTED', 'STARVED', 'BLOCKED']
      - name: reading_timestamp
        tests:
          - not_null

  - name: stg_warehouse__system_exceptions_rejects
    description: One row per fault or reject incident.
    columns:
      - name: exception_id
        tests:
          - unique
          - not_null
      - name: exception_timestamp
        tests:
          - not_null
      - name: reject_category
        tests:
          - accepted_values:
              values: ['VISION_NO_READ', 'DIMENSION_OVERHANG', 'CONVEYOR_JAM', 'ROBOTIC_MISPICK', 'WEIGHT_MISMATCH']
      - name: reject_code
        tests:
          - accepted_values:
              values: ['ERR_CAM_318', 'ERR_CAM_302', 'ERR_LABEL_UNREADABLE', 'ERR_DIM_OVER_TOLERANCE', 'ERR_DIM_UNDER_TOLERANCE', 'ERR_BOT_GRIP_FAIL', 'ERR_CNV_JAM', 'ERR_CNV_STALL', 'ERR_BOT_DROP', 'ERR_WEIGHT_LOW', 'ERR_WEIGHT_HIGH']
      - name: severity
        tests:
          - accepted_values:
              values: ['WARNING', 'ERROR', 'ESTOP_STOP']
      - name: case_id
        description: Null by design for the VISION_NO_READ category, so no not_null test.
